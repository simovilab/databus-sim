server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to databus orchestrator (avoids CORS).
    location /databus/ {
        proxy_pass http://host.docker.internal:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy to simulator HTTP control on :8081 (avoids mixed-origin issues).
    # Uses compose service DNS — on Linux, hairpinning back through
    # host.docker.internal to a sibling container's published port can be
    # blocked by iptables, so we go container-to-container directly.
    location /sim/ {
        proxy_pass http://simulator:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
