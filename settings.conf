[celery]
broker_url = redis://localhost:6379/0
result_backend = redis://localhost:6379/0

[logging]
loglevel = INFO
logfile = celery.log

[task]
task_serializer = json
result_serializer = json
accept_content = ['json']
timezone = UTC
enable_utc = true

[worker]
concurrency = 4
max_tasks_per_child = 100