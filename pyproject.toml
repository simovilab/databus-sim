[project]
name = "databus-simulator"
version = "0.1.0"
description = "SIMOVI MQTT telemetry simulator — standalone Django ASGI service"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "channels>=4.0",
    "daphne>=4.0",
    "djangorestframework>=3.15",
    "httpx>=0.27",
    "paho-mqtt>=2.1",
    "orjson>=3.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sim_project.settings"
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim_project", "simulator_app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
