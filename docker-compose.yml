services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # WS-to-TCP bridge: exposes MQTT-over-WebSockets on :8083 for the browser UI,
  # bridges every topic both ways to the databus telemetry-broker on host :1883.
  ws-bridge:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./broker/mosquitto-bridge.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${MQTT_WS_PORT:-8083}:8083"

  simulator:
    build:
      context: ./sim
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MQTT_HOST: ${MQTT_HOST:-host.docker.internal}
      MQTT_PORT: "1883"
      SIM_HTTP_PORT: "8081"
      DATABUS_BASE_URL: ${DATABUS_BASE_URL:-http://host.docker.internal:8000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCHEDULE_PATH: /app/schedule.yaml
    ports:
      - "${SIM_HTTP_PORT:-8081}:8081"
    volumes:
      - ./sim/schedule.yaml:/app/schedule.yaml
    depends_on:
      redis:
        condition: service_healthy
    command:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - sim.simulator
      - --interval
      - "2"
      - --per-route
      - "3"

  web:
    build:
      context: ./web
      additional_contexts:
        shapes: ./sim
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  redis_data:
