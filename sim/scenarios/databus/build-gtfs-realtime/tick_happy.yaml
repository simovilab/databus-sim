id: build-gtfs-realtime-tick-happy
fsm: build-gtfs-realtime
description: Scheduler fires BUILD_TRIGGERED — snapshot, build, publish feed files.

expected_branch:
  terminal_state: waiting
  via_states: [snapshotting, building, publishing]
  via_events:
    - tasks.SNAPSHOT_SUCCEEDED
    - tasks.BUILD_SUCCEEDED
    - tasks.PUBLISH_SUCCEEDED

inputs:
  - driver: scheduler
    trigger: scheduler.BUILD_TRIGGERED

expect:
  observations:
    - action: tasks.publish_feed_files
      within_ms: 10000
    - action: tasks.emit_publication_assertion
      within_ms: 12000

timeout_ms: 15000
tags: [build-gtfs-realtime, happy-path]
