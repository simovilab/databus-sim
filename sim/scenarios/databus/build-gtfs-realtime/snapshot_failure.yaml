id: build-gtfs-realtime-snapshot-failure
fsm: build-gtfs-realtime
description: DB snapshot fails — SNAPSHOT_FAILED routes to notifying without building.

expected_branch:
  terminal_state: waiting
  via_states: [snapshotting, notifying]
  via_events:
    - tasks.SNAPSHOT_FAILED
    - tasks.BUILD_NOTIFICATION_SENT

inputs:
  - driver: scheduler
    trigger: scheduler.BUILD_TRIGGERED

expect:
  observations:
    - action: tasks.log_errors
      within_ms: 5000

timeout_ms: 10000
tags: [build-gtfs-realtime, failure-path]
