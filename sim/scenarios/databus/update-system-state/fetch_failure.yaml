id: update-system-state-fetch-failure
fsm: update_system_state
description: Redis is unavailable — STATE_FETCH_FAILED routes to notifying.

expected_branch:
  terminal_state: waiting
  via_states: [fetching, notifying]
  via_events:
    - realtime_engine.STATE_FETCH_FAILED
    - realtime_engine.STATE_NOTIFICATION_SENT

inputs:
  - driver: amqp
    exchange: databus.observations
    routing_key: state.update.requested
    payload:
      vehicle_id: "bUCR-001"
      run_id: "test-run-001"
      _test_force_fetch_failure: true

expect:
  observations:
    - action: logErrors
      within_ms: 5000

timeout_ms: 10000
tags: [update-system-state, failure-path]
