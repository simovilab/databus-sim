id: update-system-state-update-failure
fsm: update_system_state
description: DB write fails during state update — STATE_UPDATE_FAILED routes to notifying.

expected_branch:
  terminal_state: waiting
  via_states: [fetching, evaluating, updating, notifying]
  via_events:
    - realtime_engine.STATE_FETCH_SUCCEEDED
    - realtime_engine.STATE_EVALUATED
    - realtime_engine.STATE_UPDATE_FAILED
    - realtime_engine.STATE_NOTIFICATION_SENT

inputs:
  - driver: amqp
    exchange: databus.observations
    routing_key: state.update.requested
    payload:
      vehicle_id: "bUCR-001"
      run_id: "test-run-001"
      _test_force_update_failure: true

expect:
  observations:
    - action: logErrors
      within_ms: 5000

timeout_ms: 12000
tags: [update-system-state, failure-path]
