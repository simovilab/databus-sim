id: update-system-state-happy
fsm: update_system_state
description: Full state update — fetch current state, evaluate, write position/progression/occupancy.

expected_branch:
  terminal_state: waiting
  via_states: [fetching, evaluating, updating]
  via_events:
    - realtime_engine.STATE_FETCH_SUCCEEDED
    - realtime_engine.STATE_EVALUATED
    - realtime_engine.STATE_UPDATE_SUCCEEDED

inputs:
  # Trigger via AMQP — realtime-engine normally fires this after telemetry processing
  - driver: amqp
    exchange: databus.observations
    routing_key: state.update.requested
    payload:
      vehicle_id: "bUCR-001"
      run_id: "test-run-001"

expect:
  observations:
    - action: publishObservation
      within_ms: 8000

timeout_ms: 12000
tags: [update-system-state, happy-path]
