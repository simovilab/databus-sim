id: save-gtfs-feed-messages-happy
fsm: save-gtfs-feed-messages
description: SAVE_TRIGGERED → serialize to parquet → persist to lake.

expected_branch:
  terminal_state: waiting
  via_states: [serializing, persisting]
  via_events:
    - tasks.SERIALIZATION_SUCCEEDED
    - tasks.PERSIST_SUCCEEDED

inputs:
  - driver: amqp
    exchange: databus.commands
    routing_key: save.triggered
    payload:
      feed_type: "vp"
      snapshot_timestamp: "{now_epoch}"

expect:
  observations:
    - action: tasks.persist_parquet_file
      within_ms: 10000
    - action: tasks.emit_persistence_assertion
      within_ms: 12000

timeout_ms: 15000
tags: [save-gtfs-feed-messages, happy-path]
