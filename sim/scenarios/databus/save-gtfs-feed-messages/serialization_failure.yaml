id: save-gtfs-feed-messages-serialization-failure
fsm: save-gtfs-feed-messages
description: Parquet serialization fails — SERIALIZATION_FAILED routes to notifying.

expected_branch:
  terminal_state: waiting
  via_states: [serializing, notifying]
  via_events:
    - tasks.SERIALIZATION_FAILED
    - tasks.SAVE_NOTIFICATION_SENT

inputs:
  - driver: amqp
    exchange: databus.commands
    routing_key: save.triggered
    payload:
      feed_type: "vp"
      snapshot_timestamp: "{now_epoch}"
      _test_force_serialization_failure: true

expect:
  observations:
    - action: tasks.log_errors
      within_ms: 5000

timeout_ms: 10000
tags: [save-gtfs-feed-messages, failure-path]
