[project]
name = "simovi-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "paho-mqtt>=2.1",
    "aio-pika>=9.4",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "jsonpath-ng>=1.6",
    "watchdog>=5.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "gtfs-realtime-bindings>=1.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis>=2.26",
    "rich>=13.7",
    # keep original simulator dep
    "orjson>=3.11.8",
    # HTTP control surface (P0, agent B)
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv]
dev-dependencies = ["ruff", "mypy", "pytest-cov"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p no:anyio"
markers = [
    "unit: fast unit tests (no external services)",
    "integration: requires running databus stack",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
