# WS-to-TCP bridge: exposes MQTT-over-WebSockets on :8083 for the browser UI,
# and bridges every topic both ways to databus's telemetry-broker on host :1883.
# Databus and its broker stay untouched.

listener 8083
protocol websockets
allow_anonymous true

listener 1884
protocol mqtt
allow_anonymous true

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

connection databus
address host.docker.internal:1883
try_private false
cleansession true
notifications false
start_type automatic
keepalive_interval 30

# Bridge every topic, both directions, QoS 0.
topic # both 0 "" ""
